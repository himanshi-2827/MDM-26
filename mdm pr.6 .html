<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Calculator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center
             bg-slate-950 p-5">

    <!-- Background Glow -->
    <div class="fixed top-10 left-10 w-72 h-72
                bg-cyan-500 rounded-full blur-[150px] opacity-30">
    </div>

    <div class="fixed bottom-10 right-10 w-72 h-72
                bg-purple-600 rounded-full blur-[150px] opacity-30">
    </div>


    <!-- Main Card -->
    <div class="relative w-full max-w-md
                bg-slate-900
                border border-slate-700
                rounded-3xl
                p-8
                shadow-2xl">


        <!-- Header -->
        <div class="text-center mb-8">

            <!-- Attractive Symbol -->
            <div class="mx-auto mb-4 w-20 h-20
                        flex items-center justify-center
                        rounded-2xl
                        bg-gradient-to-br
                        from-cyan-400 to-purple-600
                        shadow-lg shadow-cyan-500/30">

                <span class="text-5xl text-white">
                    ✦
                </span>

            </div>

            <h1 class="text-3xl font-black text-white">
                Student Result
            </h1>

            <p class="text-slate-400 mt-2">
                ◈ Calculate your academic performance ◈
            </p>

        </div>


        <!-- Lab Practical 1 -->
        <div class="mb-5">

            <label class="flex items-center gap-2
                          text-cyan-300 font-bold">

                <span class="w-8 h-8 flex items-center justify-center
                             rounded-lg bg-cyan-500/10
                             border border-cyan-500/30">
                    ◆
                </span>

                Lab Practical 1

            </label>

            <input
                type="number"
                id="j1"
                min="0"
                max="100"
                placeholder="Enter marks  •  /100"
                class="w-full mt-3 px-5 py-4
                       bg-slate-800
                       text-white
                       placeholder-slate-500
                       rounded-xl
                       border border-slate-700
                       outline-none
                       focus:border-cyan-400
                       focus:ring-4 focus:ring-cyan-400/10
                       transition duration-300"
            >

        </div>


        <!-- Lab Practical 2 -->
        <div class="mb-5">

            <label class="flex items-center gap-2
                          text-purple-300 font-bold">

                <span class="w-8 h-8 flex items-center justify-center
                             rounded-lg bg-purple-500/10
                             border border-purple-500/30">
                    ◈
                </span>

                Lab Practical 2

            </label>

            <input
                type="number"
                id="j2"
                min="0"
                max="100"
                placeholder="Enter marks  •  /100"
                class="w-full mt-3 px-5 py-4
                       bg-slate-800
                       text-white
                       placeholder-slate-500
                       rounded-xl
                       border border-slate-700
                       outline-none
                       focus:border-purple-400
                       focus:ring-4 focus:ring-purple-400/10
                       transition duration-300"
            >

        </div>


        <!-- Viva -->
        <div class="mb-7">

            <label class="flex items-center gap-2
                          text-pink-300 font-bold">

                <span class="w-8 h-8 flex items-center justify-center
                             rounded-lg bg-pink-500/10
                             border border-pink-500/30">
                    ✦
                </span>

                Viva / Oral

            </label>

            <input
                type="number"
                id="viva"
                min="0"
                max="100"
                placeholder="Enter marks  •  /100"
                class="w-full mt-3 px-5 py-4
                       bg-slate-800
                       text-white
                       placeholder-slate-500
                       rounded-xl
                       border border-slate-700
                       outline-none
                       focus:border-pink-400
                       focus:ring-4 focus:ring-pink-400/10
                       transition duration-300"
            >

        </div>


        <!-- Calculate Button -->
        <button
            onclick="calculateResult()"
            class="w-full py-4 rounded-xl
                   bg-gradient-to-r
                   from-cyan-500 via-blue-500 to-purple-600
                   text-white font-black text-lg
                   shadow-lg shadow-blue-500/30
                   hover:scale-105
                   active:scale-95
                   transition duration-300">

            ★  Calculate Result  ★

        </button>


        <!-- Result -->
        <div class="mt-8">

            <h2 class="text-xl font-bold text-white mb-4">

                <span class="text-cyan-400">◆</span>
                Result Summary
                <span class="text-purple-400">◆</span>

            </h2>


            <!-- Total -->
            <div class="flex justify-between items-center
                        p-4 mb-3 rounded-xl
                        bg-slate-800
                        border border-cyan-500/20
                        hover:border-cyan-400
                        transition">

                <span class="text-slate-400">
                    ∑ &nbsp; Total Marks
                </span>

                <span id="total"
                      class="font-bold text-cyan-400">
                    —
                </span>

            </div>


            <!-- Percentage -->
            <div class="flex justify-between items-center
                        p-4 mb-3 rounded-xl
                        bg-slate-800
                        border border-purple-500/20
                        hover:border-purple-400
                        transition">

                <span class="text-slate-400">
                    % &nbsp; Percentage
                </span>

                <span id="percentage"
                      class="font-bold text-purple-400">
                    —
                </span>

            </div>


            <!-- Grade -->
            <div class="flex justify-between items-center
                        p-4 rounded-xl
                        bg-slate-800
                        border border-pink-500/20
                        hover:border-pink-400
                        transition">

                <span class="text-slate-400">
                    ♛ &nbsp; Grade
                </span>

                <span id="grade"
                      class="text-3xl font-black text-pink-400">
                    —
                </span>

            </div>

        </div>


        <!-- Bottom Decoration -->
        <div class="text-center mt-7 text-slate-600">
            ──────── ✦ ────────
        </div>

        <p class="text-center text-xs text-slate-600 mt-2">
            Academic Performance Calculator
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        function calculateResult() {

            let p1 = Number(document.getElementById("j1").value);
            let p2 = Number(document.getElementById("j2").value);
            let viva = Number(document.getElementById("viva").value);

            // Check marks
            if (p1 < 0 || p1 > 100 ||
                p2 < 0 || p2 > 100 ||
                viva < 0 || viva > 100) {

                alert("◆ Please enter marks between 0 and 100 ◆");
                return;
            }

            // Total
            let total = p1 + p2 + viva;

            // Percentage
            let percentage = (total / 300) * 100;

            // Grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display Result
            document.getElementById("total").innerHTML =
                total + " / 300";

            document.getElementById("percentage").innerHTML =
                percentage.toFixed(2) + "%";

            document.getElementById("grade").innerHTML =
                grade;
        }

    </script>

</body>

</html>
